<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NextG Wireless Lab — NC State</title>
  <meta name="description" content="NextG Wireless Lab at NC State University — research in next-generation intelligent wireless systems. Site coming soon." />
  <style>
    :root {
      --wolfred: #CC0000;
      --wolfred-dark: #990000;
      --ink: #1A1A1A;
      --gray-50: #F7F7F7;
      --gray-300: #CCCCCC;
      --gray-500: #7A7A7A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--gray-50);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .bar { height: 6px; background: var(--wolfred); }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--wolfred);
      margin-bottom: 1.25rem;
    }
    h1 {
      font-family: Georgia, Cambria, serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
      max-width: 18ch;
      margin-bottom: 1rem;
    }
    p.lead {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--gray-500);
      max-width: 46ch;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      border: 1px solid var(--gray-300);
      border-radius: 999px;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      background: #fff;
    }
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--gray-500);
      border-top: 1px solid var(--gray-300);
    }
    footer a { color: var(--wolfred-dark); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <main>
    <div class="eyebrow">NC State University</div>
    <h1>NextG Wireless Lab</h1>
    <p class="lead">
      Advancing next-generation intelligent wireless systems &mdash; research,
      people, and facilities. Our website is coming soon.
    </p>
    <span class="badge">Site under construction</span>
  </main>
  <footer>
    &copy; <span id="year"></span> NextG Wireless Lab, NC State University &middot;
    <a href="https://github.com/NextG-Wireless-Lab-NC-State">GitHub</a>
  </footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
